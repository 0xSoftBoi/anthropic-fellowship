name: ci

on: [push, pull_request]

jobs:
  benchmark-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-security
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test deps (no API key needed)
        run: pip install pytest

      - name: Dataset integrity
        run: python -m benchmarks.validate_dataset

      - name: Unit tests (eval logic + sanitizer safety + integrity)
        run: python -m pytest tests/ -q

      # Fails the build if the sanitizer ever changes program semantics (token stream or
      # control-flow counts), which would silently invalidate the leakage/contamination
      # deltas. Also re-measures leakage so the finding can't regress unnoticed.
      - name: Prompt-leakage audit + sanitizer safety invariant
        run: python -m benchmarks.sanitize

      # Locks the paid contamination experiment to the exact published 16+5+3 population,
      # verifies stripped/anon invariants and leakage removal, and computes a zero-cost
      # planning estimate using versioned list pricing. No credential is available here.
      - name: Re-measurement population + sanitizer preflight
        run: |
          python -m agents.remeasure --preflight
          python -m agents.remeasure --estimate

      # Reproduces the committed semantic F1 from the judge's own decisions (asserted
      # inside the module) and recomputes the gold-corrected figure + bootstrap CI.
      - name: Judge-validity analysis (reproduction gate)
        run: python -m agents.judge_uncertainty

      # Verifies the ablation harness can plan every configuration without an API key.
      - name: Judge-ablation dry run
        run: python -m agents.judge_ablation --full --dry-run

      # Negative-control (live) domain: regenerate the static baseline over the
      # audit-hardened first-party contracts and score specificity. Keeps the "does the
      # model over-flag unmemorized code" arm honest and reproducible.
      - name: Live negative-control static baseline + specificity
        run: |
          python -m agents.benchmark_runner --live --no-claude
          python -m agents.specificity results_live.json

      # Matched-pair (positive) domain: the pre-audit versions of the same contracts,
      # labeled from the git fix-commit diffs. Regenerates the static baseline so the
      # "0/16 static recall on real, unmemorized bugs" figure can't regress unnoticed.
      - name: Matched-pair static baseline (recall on unmemorized bugs)
        run: python -m agents.benchmark_runner --matched --no-claude

      # External-dependency negative controls: the unhacked, in-use contracts Suwappu depends
      # on (committed verified source). Static baseline + specificity, so the domain stays
      # runnable and the "static over-flags real hardened code" figure is reproducible.
      - name: Dependency negative-control static baseline + specificity
        run: |
          python -m agents.benchmark_runner --deps --no-claude
          python -m agents.specificity results_deps.json

      - name: Static benchmark smoke test (free, no model)
        run: python -m agents.benchmark_runner --real --no-claude
