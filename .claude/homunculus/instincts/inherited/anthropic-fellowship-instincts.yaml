# Naming (Python)

## Action

`snake_case` files and functions, `PascalCase` classes (`AgentAudit`,
`CascadeAudit`, `StaticFinding`), `SCREAMING_SNAKE_CASE` constants
(`MAX_SOURCE_CHARS`). Functions are snake_case — not camelCase.

## Evidence

- Verified across `agents/*.py`.

