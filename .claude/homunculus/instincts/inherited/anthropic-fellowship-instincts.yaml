# Commit Format

## Action

Concise, descriptive; a `type:` prefix (`feat:`, `docs:`, `fix:`) is common. Add a
`Co-Authored-By:` trailer for agent commits.

## Evidence

- Recent history: `feat:`/`docs:` prefixed and freeform subjects, ~50–80 chars.
