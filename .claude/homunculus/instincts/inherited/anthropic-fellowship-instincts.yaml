# Route Model Calls Through agents/llm.py

## Action

Call `llm.completion(...)` — the single provider-agnostic path. Never import an
Anthropic/OpenAI SDK directly. Select the model with `BENCH_MODEL` (alias or full id).

## Evidence

- `agents/llm.py` defines `completion`, `MODELS`, `litellm_model`, `has_credentials`;
  every analyzer imports it.

