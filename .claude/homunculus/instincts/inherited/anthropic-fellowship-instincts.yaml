# Keep the Judge on a Calibrated Anthropic Model

## Action

Leave `JUDGE_MODEL` on the fixed calibrated Anthropic default. Never set it to the
model under test — that destroys cross-model F1 comparability.

## Evidence

- `semantic_rescorer.py` reads `JUDGE_MODEL` (default `claude-haiku-4-5-...`);
  `validate_judge.py` calibrates it.

