# Tests

## Action

Put tests in `ai-security/tests/` and run with pytest: `python -m pytest tests/ -q`.
Dataset integrity runs keyless: `python -m benchmarks.validate_dataset`.

## Evidence

- `tests/test_eval.py`; README and CI invoke pytest.

