# Stamp Results Per Model; Don't Clobber Baselines

## Action

Name result files with `model_tag()` so each model's output is separate. Do not
overwrite the committed Sonnet/Opus baselines.

## Evidence

- `model_tag()` in `agents/llm.py` yields the bare model name for filenames.

